name: publish

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Read .tool-versions
        id: versions
        # .tool-versions から erlang-otp と gleam のバージョンを抽出
        run: |
          echo "otp=$(grep erlang .tool-versions | awk '{print $2}')" >> $GITHUB_OUTPUT
          echo "gleam=$(grep gleam .tool-versions | awk '{print $2}')" >> $GITHUB_OUTPUT
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ steps.versions.outputs.otp }}
          gleam-version: ${{ steps.versions.outputs.gleam }}
          rebar3-version: "3"
      - run: gleam deps download
      - run: gleam test
      - run: gleam format --check src test
      - run: gleam run
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
